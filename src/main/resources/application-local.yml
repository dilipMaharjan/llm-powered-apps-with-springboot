# noinspection SpellCheckingInspection
spring:
  application:
    name: ai-app#local
  docker:
    compose:
      stop:
        command: down
  ai:
    vectorstore:
      qdrant:
        initialize-schema: true
        host: localhost
        port: 6334
        collection-name: rag
    model:
      chat: ollama
    ollama:
      chat:
        model: llama3.2
        options:
          temperature: 0
          top-k: 1
          top-p: 1
          repeat-penalty: 1
          seed: 42
server:
  port: 8080
logging:
  level:
    org:
      springframework:
        ai: DEBUG
  pattern:
    console: "%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n"


keywords: Political Engagement, personal, Employees, mindful, reputation, authority
#logging
#Observability
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  tracing:
    sampling:
      probability: 1

opentelemetry:
  otel:
    exporter:
      otlp:
        endpoint: http://localhost:4317
