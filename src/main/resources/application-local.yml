spring:
  application:
    name: ai-app#local
  datasource:
    url: jdbc:h2:file:~/localdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
            schema: classpath:/schema/schema-@@platform@@.sql
  h2:
    console:
      enabled: true
      path: /h2-console
server:
  port: 8080

logging:
  level:
    org.springframework.ai.chat.client.advisor: DEBUG
  pattern:
    console: "%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n"


